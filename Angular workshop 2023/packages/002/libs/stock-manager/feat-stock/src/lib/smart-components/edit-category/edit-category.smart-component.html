<div class="edit-category__top">
  <h1>Category {{category?.name}}</h1>
  <button (click)="onRemove()" shButton>Remove</button>
</div>
<div class="edit-category__content">
  <sh-pane>
    <form #form="ngForm" (ngSubmit)="onSubmit()">
      <label>
        <span>Name</span>
        <input [(ngModel)]="category.name" name="name" required type="text" />
      </label>
      <label>
        <span>Description</span>
        <textarea
          [(ngModel)]="category.description"
          name="description"
          required
        ></textarea>
      </label>

      <div class="edit-category__actions">
        <a routerLink="../" shButton>Cancel</a>
        <button [disabled]="form.invalid" shButton>Save</button>
      </div>
    </form>
  </sh-pane>
</div>
